services:
  mysql:
    image: mysql:8.4
    container_name: easysql-mysql-test
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: easysql_test
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./tests/fixtures/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  postgres:
    image: postgres:17
    container_name: easysql-postgres-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: easysql_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d easysql_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./tests/fixtures/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
