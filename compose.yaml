services:
  mysql:
    image: mysql:8.4
    container_name: easysql-mysql-test
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: easysql_test
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./tests/fixtures/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  postgres:
    image: postgres:17
    container_name: easysql-postgres-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: easysql_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d easysql_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./tests/fixtures/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: easysql-clickhouse-test
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DB: easysql_test
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

