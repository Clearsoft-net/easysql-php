name: Generate SDK

on:
  repository_dispatch:
    types: [spec_updated]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install dependencies
        run: make install

      - name: Generate SDK
        run: make generate
        env:
          EASYSQL_API_URL: ${{ vars.EASYSQL_API_URL || 'https://api.easysql.net' }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --exit-code; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        id: pr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(sdk): regenerate SDK from latest spec"
          title: "feat(sdk): regenerate SDK from latest spec"
          body: |
            Auto-generated from the latest OpenAPI specification.

            Triggered by `repository_dispatch` from [easysql-api](https://github.com/Clearsoft-net/easysql-api).

            *Note: Merging this PR will trigger a new Minor version release. Change the PR title to `fix(sdk): ...` before merging if this only contains bug fixes, or to `chore: ...` if you do not want to trigger a release.*
          branch: auto/sdk-regeneration
          delete-branch: false

      - name: Approve Pull Request
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ steps.pr.outputs.pull-request-number }} --approve || echo "Approve skipped — GITHUB_TOKEN cannot approve its own PR"

      - name: Enable Auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.pr.outputs.pull-request-number }} --squash --auto --delete-branch
