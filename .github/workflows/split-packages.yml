name: Split packages

# Mirrors each packages/* directory into its own read-only repository so
# Packagist can serve the individual packages (Packagist reads a repo's ROOT
# composer.json — it cannot publish a subdirectory of the monorepo directly).
#
# - Every push of a `v*` tag updates the split repos' main branch AND forwards
#   the tag → Packagist auto-updates via its GitHub webhook.
# - `workflow_dispatch` syncs main only, or splits the supplied `tag`.
#
# The release workflow dispatches this workflow with the tag semantic-release
# just created (see .releaserc.json successCmd), because a tag pushed with the
# default GITHUB_TOKEN does NOT trigger the `push: tags` event.
#
# One-time setup (required):
# 1. Mirror repos exist: Clearsoft-net/easysql-php-{client,common,laravel,
#    schema-generation,connectors}.
# 2. A token with write access to those repos is stored as the `SPLIT_PAT`
#    secret (a classic PAT with `repo`, or a fine-grained PAT with Contents:
#    read/write on every mirror). The default GITHUB_TOKEN is scoped to this
#    repository only and CANNOT push to the mirrors.
# 3. Each mirror is submitted on Packagist with auto-update enabled.
#
# NOTE: no `paths:` filter — a `paths` filter also gates tag pushes, which
# would skip publishing when a release tag's commit doesn't touch packages/.
# The split action is cheap and idempotent, so running on every tag is safe.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to split (e.g. v3.1.0); leave empty to sync main only"
        required: false
        type: string

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - { directory: "packages/client", repo: "easysql-php-client" }
          - { directory: "packages/common", repo: "easysql-php-common" }
          - { directory: "packages/laravel", repo: "easysql-php-laravel" }
          - { directory: "packages/schema-generation", repo: "easysql-php-schema-generation" }
          - { directory: "packages/connectors", repo: "easysql-php-connectors" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      # The published composer.json must not carry a hardcoded "version"
      # (Packagist derives the version from the git tag) nor path
      # repositories (they don't exist for consumers). The monorepo files on
      # disk are left untouched — only the split artifact is cleaned.
      - name: Clean distribution composer.json
        run: |
          php -r '
            $f = "${{ matrix.package.directory }}/composer.json";
            $j = json_decode(file_get_contents($f), true);
            unset($j["version"]);
            if (isset($j["repositories"])) {
              $j["repositories"] = array_values(array_filter(
                $j["repositories"],
                fn ($r) => ($r["type"] ?? "") !== "path"
              ));
              if ($j["repositories"] === []) {
                unset($j["repositories"]);
              }
            }
            file_put_contents($f, json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . PHP_EOL);
          '
          git diff --stat -- ${{ matrix.package.directory }}/composer.json || true

      # Sync the subdirectory to the split repo's main branch.
      - name: Split (branch)
        if: steps.release.outputs.tag == ''
        uses: danharrin/monorepo-split-github-action@v2.3.0
        with:
          package_directory: ${{ matrix.package.directory }}
          repository_organization: Clearsoft-net
          repository_name: ${{ matrix.package.repo }}
          branch: main
          user_name: Clearsoft Bot
          user_email: support@clearsoft.net
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_PAT }}

      # Forward the version tag → Packagist publishes the stable release.
      - name: Split (tag)
        if: steps.release.outputs.tag != ''
        uses: danharrin/monorepo-split-github-action@v2.3.0
        with:
          tag: ${{ steps.release.outputs.tag }}
          package_directory: ${{ matrix.package.directory }}
          repository_organization: Clearsoft-net
          repository_name: ${{ matrix.package.repo }}
          branch: main
          user_name: Clearsoft Bot
          user_email: support@clearsoft.net
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_PAT }}

      # The split action reports success even when its internal push fails
      # (e.g. the mirror repository does not exist, or SPLIT_PAT lacks write
      # access to it). Verify the expected ref actually landed so a failed split
      # fails the job instead of passing silently.
      - name: Verify the mirror received the split
        env:
          SPLIT_PAT: ${{ secrets.SPLIT_PAT }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${SPLIT_PAT}@github.com/Clearsoft-net/${{ matrix.package.repo }}.git"
          tag="${{ steps.release.outputs.tag }}"
          if [ -n "$tag" ]; then
            ref="refs/tags/${tag}"
          else
            ref="refs/heads/main"
          fi
          if git ls-remote --exit-code "$remote" "$ref" >/dev/null 2>&1; then
            echo "OK: Clearsoft-net/${{ matrix.package.repo }} has ${ref}."
          else
            echo "::error::Clearsoft-net/${{ matrix.package.repo }} is missing ${ref} — the split push failed. Check that the mirror repository exists and that SPLIT_PAT has write access to it."
            exit 1
          fi

