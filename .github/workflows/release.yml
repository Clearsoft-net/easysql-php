name: Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Static analysis
        run: make analyse

      - name: Start MySQL (Docker Compose)
        run: make db-up

      - name: Run tests (including MySQL integration)
        run: EASYSQL_TEST_MYSQL=1 EASYSQL_TEST_POSTGRES=1 make test

      - name: Verify generated package was not hand-edited
        run: make check
        env:
          EASYSQL_API_URL: ${{ vars.EASYSQL_API_URL || 'https://api.easysql.net' }}

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch all history for all tags and branches (needed for semantic-release)
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-composer-

      - name: Install PHP dependencies
        run: make install

      - name: Validate composer manifests
        run: |
          composer validate --no-check-lock
          for f in packages/client/composer.json packages/common/composer.json packages/laravel/composer.json packages/connectors/mysql/composer.json packages/connectors/postgres/composer.json packages/connectors/sqlite/composer.json packages/schema-generation/composer.json; do
            (cd "$(dirname "$f")" && composer validate --no-check-lock)
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install semantic-release dependencies
        run: npm install --no-save semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/exec

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 'Clearsoft Bot'
          GIT_AUTHOR_EMAIL: 'support@clearsoft.net'
          GIT_COMMITTER_NAME: 'Clearsoft Bot'
          GIT_COMMITTER_EMAIL: 'support@clearsoft.net'
